<button
  class="button button--ghost delete-trip-button"
  type="button"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  [attr.aria-busy]="isDeleting"
  [class.delete-trip-button--busy]="isDeleting"
  (click)="onClick($event)"
>
  <span class="delete-trip-button__icon" aria-hidden="true"></span>
</button>
