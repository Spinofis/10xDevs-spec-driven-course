@if (isLoading && items.length === 0) {
  <app-trip-list-state-banner state="loading" message="Laduje zapisane wycieczki..." />
} @else if (!error && items.length === 0) {
  <app-trip-list-state-banner
    state="empty"
    [message]="hasActiveFilters ? 'Nic nie pasuje do wybranych filtrow.' : 'Nie masz jeszcze zapisanych wycieczek.'"
    [canClearFilters]="hasActiveFilters"
    [showCreateLink]="!hasActiveFilters"
    (clearFilters)="clearFilters.emit()"
  />
} @else if (items.length > 0) {
  <div class="trip-list" [attr.aria-busy]="isLoading">
    @for (item of items; track item.id) {
      <app-trip-list-row
        [item]="item"
        [deleteDisabled]="isLoading || isDeleting(item.id)"
        [isDeleting]="isDeleting(item.id)"
        (open)="openTrip.emit($event)"
        (deleteRequested)="requestDelete.emit($event)"
      />
    }
  </div>

  @if (isLoading) {
    <p class="inline-status" aria-live="polite">Odswiezam wyniki...</p>
  }
}
