<section class="page" aria-labelledby="trips-title">
  <header class="page-header">
    <div>
      <p class="eyebrow">Planner</p>
      <h1 id="trips-title">Wycieczki</h1>
      <p>Lista zapisanych wycieczek z wyszukiwaniem, filtrami i paginacja kursorowa.</p>
    </div>
    <a class="button button--primary" routerLink="/trips/new">Nowa wycieczka</a>
  </header>

  <app-trip-list-toolbar
    [filtersForm]="filtersForm"
    [hasPlanOptions]="hasPlanOptions"
    [sortOptions]="sortOptions"
    [limitOptions]="limitOptions"
    [isLoading]="isLoading()"
    [hasActiveFilters]="hasActiveFilters()"
    [validationMessage]="validationMessage()"
    (filtersSubmit)="submitFilters()"
    (clearFilters)="clearFilters()"
  />

  @if (error(); as errorVm) {
    <app-trip-list-state-banner
      state="error"
      heading="Nie udalo sie wczytac wycieczek"
      [message]="errorVm.message"
      [correlationId]="errorVm.correlationId ?? null"
      [asPanel]="true"
      [canClearFilters]="errorVm.canClearFilters"
      [canRetry]="errorVm.code !== 'VALIDATION_ERROR'"
      [isLoading]="isLoading()"
      (clearFilters)="clearFilters()"
      (retry)="retry()"
    />
  }

  <section class="panel" aria-labelledby="trip-list-title">
    <div class="section-heading">
      <h2 id="trip-list-title">Wyniki</h2>
      <span class="badge">{{ resultBadge() }}</span>
    </div>

    <app-trip-list
      [items]="items()"
      [isLoading]="isLoading()"
      [error]="error()"
      [hasActiveFilters]="hasActiveFilters()"
      [deletingTripId]="deletingTripId()"
      (openTrip)="openTrip($event)"
      (requestDelete)="requestDelete($event)"
      (clearFilters)="clearFilters()"
    />

    @if (items().length > 0 || pagination().pageIndex > 1) {
      <app-trip-list-pagination
        [nextCursor]="pagination().nextCursor"
        [canGoBack]="canGoBack()"
        [isLoading]="isLoading()"
        [pageIndex]="pagination().pageIndex"
        (previous)="goPrevious()"
        (next)="goNext()"
      />
    }
  </section>
</section>

<app-confirm-delete-trip-dialog
  [trip]="pendingDelete()"
  [isDeleting]="isPendingDeleteInProgress()"
  [error]="deleteError()"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()"
/>
